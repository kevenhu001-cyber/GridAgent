name: Optional scientific extensions
on:
  pull_request:
    paths:
      - 'src/gridagent/plugins.py'
      - 'examples/scientific/**'
      - 'tests/test_optional_scientific_extensions.py'
      - '.github/workflows/optional-science.yml'
  push:
    branches: [main]
    paths:
      - 'src/gridagent/plugins.py'
      - 'examples/scientific/**'
      - 'tests/test_optional_scientific_extensions.py'
      - '.github/workflows/optional-science.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joblib:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Install catalog dependency for trusted test
        run: python -m pip install --only-binary=:all: "joblib>=1.4,<2"
      - run: python -m pytest tests/test_plugins.py tests/test_optional_scientific_extensions.py -k "not docling_local" -q --timeout=120
      - name: Check managed plugin install and uninstall
        run: python -c "from gridagent import plugins; print(plugins.install('joblib')); assert plugins.installed_target('joblib'); print(plugins.uninstall('joblib'))"
  docling:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Install document conversion dependencies
        run: python -m pip install --only-binary=:all: "docling>=2.50,<3"
      - run: python -m pytest tests/test_optional_scientific_extensions.py -k docling_local -q --timeout=180
