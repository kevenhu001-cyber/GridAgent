name: Isolated kernel protocol
on:
  pull_request:
    paths:
      - 'src/gridagent/kernel_batch.py'
      - 'src/gridagent/scientific_runtime.py'
      - 'src/gridagent/native_jobs.py'
      - 'src/gridagent/native_service.py'
      - 'tests/test_kernel_batch.py'
      - 'tests/test_native_jobs.py'
      - 'pyproject.toml'
      - '.github/workflows/kernel-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'src/gridagent/kernel_batch.py'
      - 'src/gridagent/scientific_runtime.py'
      - 'src/gridagent/native_jobs.py'
      - 'src/gridagent/native_service.py'
      - 'tests/test_kernel_batch.py'
      - 'tests/test_native_jobs.py'
      - 'pyproject.toml'
      - '.github/workflows/kernel-runtime.yml'
permissions:
  contents: read
jobs:
  kernel:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,kernel]"
      - run: python -c "import jupyter_client, ipykernel"
      - run: python -m pytest tests/test_kernel_batch.py tests/test_native_jobs.py -q --timeout=150
