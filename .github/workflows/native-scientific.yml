name: Native scientific IPC
on:
  pull_request:
    paths:
      - 'src/gridagent/**'
      - 'tests/test_native_service.py'
      - 'tests/test_native_jobs.py'
      - 'vendor/proliferate/apps/desktop/src-tauri/src/scientific.rs'
      - '.github/workflows/native-scientific.yml'
  push:
    branches: [main]
    paths:
      - 'src/gridagent/**'
      - 'tests/test_native_service.py'
      - 'tests/test_native_jobs.py'
      - '.github/workflows/native-scientific.yml'
permissions:
  contents: read
jobs:
  python-protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/gridagent/native_service.py src/gridagent/native_jobs.py tests/test_native_service.py tests/test_native_jobs.py
      - run: python -m pytest -q tests/test_native_service.py tests/test_native_jobs.py tests/test_scientific_workspace.py
