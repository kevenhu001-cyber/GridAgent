name: Notebook export
on:
  pull_request:
    paths:
      - 'src/gridagent/scientific_notebook.py'
      - 'src/gridagent/native_service.py'
      - 'tests/test_scientific_notebook.py'
      - 'pyproject.toml'
      - '.github/workflows/notebook-export.yml'
  push:
    branches: [main]
    paths:
      - 'src/gridagent/scientific_notebook.py'
      - 'src/gridagent/native_service.py'
      - 'tests/test_scientific_notebook.py'
      - 'pyproject.toml'
      - '.github/workflows/notebook-export.yml'
permissions:
  contents: read
jobs:
  export:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,notebook]"
      - run: python -c "import nbformat"
      - run: python -m pytest tests/test_scientific_notebook.py -q --timeout=120
