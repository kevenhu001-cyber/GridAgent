name: Windows desktop build check
on:
  pull_request:
    paths:
      - 'vendor/proliferate/**'
      - 'integration/pi-runtime/**'
      - 'src/gridagent/native_service.py'
      - 'pyproject.toml'
      - '.github/workflows/windows-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'vendor/proliferate/**'
      - 'integration/pi-runtime/**'
      - 'src/gridagent/native_service.py'
      - 'pyproject.toml'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: vendor/proliferate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install the Python scientific service
        working-directory: .
        run: python -m pip install -e .
      - name: Install the locked Pi worker dependencies
        working-directory: integration/pi-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start the Pi worker against the installed service
        working-directory: integration/pi-runtime
        run: python smoke_install.py
      - run: pnpm install --frozen-lockfile
      - name: Build SDK contracts for file hook regression tests
        run: pnpm --filter @anyharness/sdk build
      - name: Verify native file routing and legacy isolation
        run: pnpm --filter @anyharness/sdk-react test src/hooks/files.test.tsx
      - name: Build the retained desktop frontend
        run: pnpm --filter proliferate build
      - name: Verify retained native project inventory and path integration
        run: pnpm --filter @proliferate/product-client test src/lib/access/pi/native-project.test.ts src/hooks/workspaces/cache/use-workspaces.test.tsx src/providers/WorkspacePathProvider.test.tsx
      - name: Compile-check the Tauri host and its tests
        run: cargo check --locked --target x86_64-pc-windows-msvc -p proliferate --tests
      - name: Verify Pi history recovery and workspace isolation
        run: cargo test --locked --target x86_64-pc-windows-msvc -p proliferate --lib pi_history::tests
          cargo test --locked --target x86_64-pc-windows-msvc -p proliferate --lib scientific_projects::tests
      - name: Verify native project identity binding
        run: cargo test --locked --target x86_64-pc-windows-msvc -p proliferate --lib scientific::tests
