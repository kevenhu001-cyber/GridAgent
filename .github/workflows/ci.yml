name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -m 'not integration' -q
  andes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev,andes]'
      - run: pytest -m integration -q
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: pip install -e '.[dev,andes]'
      - run: pytest -m 'not integration' -q
      - run: dotnet publish desktop/GridAgent.Windows -c Release -r win-x64 --self-contained true -o desktop-publish
      - uses: actions/upload-artifact@v4
        with:
          name: GridAgent-Windows-x64
          path: desktop-publish/
