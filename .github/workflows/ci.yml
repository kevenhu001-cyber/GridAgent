name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: python scripts/sync_benchmark.py benchmark-assets
      - run: python scripts/sync_evaluator.py offline-evaluation/test_memory.json
      - run: ruff check src tests
      - run: pytest -m 'not integration' -q
  andes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev,engineering]'
      - run: pytest -m integration -q
  winui-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test UI-independent presentation state
        run: dotnet run --project desktop/GridAgent.Presentation.Tests/GridAgent.Presentation.Tests.csproj -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate approved brand assets
        run: |
          python -m pip install 'Pillow>=11,<13'
          python desktop/msix/make-assets.py desktop/GridAgent.WinUI/BrandAssets
      - name: Compile native WinUI workbench
        run: dotnet build desktop/GridAgent.WinUI/GridAgent.WinUI.csproj -c Release -r win-x64
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: pip install -e '.[dev,engineering]'
      - run: python scripts/sync_benchmark.py benchmark-assets
      - run: pytest -m 'not integration' -q
      - run: pytest -m integration -q
      - name: Install build-time artwork dependency
        run: python -m pip install 'Pillow>=11,<13'
      - name: Build and verify portable Windows application
        shell: pwsh
        run: ./desktop/package-windows.ps1 -Output desktop-publish
      - name: Measure isolated bridge startup latency
        shell: pwsh
        run: |
          & ./desktop-publish/runtime/python.exe -X utf8 ./desktop/measure-startup.py | Tee-Object -FilePath bridge-startup.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content bridge-startup.json >> $env:GITHUB_STEP_SUMMARY
      - name: Report portable package sizes
        shell: pwsh
        run: |
          $total = (Get-ChildItem desktop-publish -Recurse -File | Measure-Object Length -Sum).Sum
          $python = (Get-ChildItem desktop-publish/runtime -Recurse -File | Measure-Object Length -Sum).Sum
          "Total portable bytes: $total" >> $env:GITHUB_STEP_SUMMARY
          "Private Python bytes: $python" >> $env:GITHUB_STEP_SUMMARY
          "Desktop and other assets bytes: $($total - $python)" >> $env:GITHUB_STEP_SUMMARY
      - name: Verify optional plugin install, run and removal
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\\System32;$env:SystemRoot"
          & ./desktop-publish/runtime/python.exe -X utf8 ./desktop/smoke_plugins.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GridAgent-Windows-x64
          path: desktop-publish/
      - name: Build and sign development MSIX
        shell: pwsh
        run: ./desktop/package-msix.ps1 -PortableDirectory desktop-publish -OutputDirectory desktop-msix -Version "1.0.$env:GITHUB_RUN_NUMBER.0" -Development
      - uses: actions/upload-artifact@v4
        with:
          name: GridAgent-Windows-x64-MSIX-Development
          path: desktop-msix/
          if-no-files-found: error
      - name: Install and activate signed development MSIX
        shell: powershell
        run: ./desktop/msix/test-installed.ps1 -PackageDirectory desktop-msix -DisposableTestMachine
