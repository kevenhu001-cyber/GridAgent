name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A superseded PR commit does not need to consume another full packaging run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore pip download and wheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip311-unit-v1-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip311-unit-v1-
      - run: pip install -e '.[dev]'
      - name: Restore pinned public benchmark assets
        uses: actions/cache@v4
        with:
          path: benchmark-assets
          key: ${{ runner.os }}-public-benchmark-v1-${{ hashFiles('src/gridagent/paper_assets.json', 'scripts/sync_benchmark.py') }}
      - run: python scripts/sync_benchmark.py benchmark-assets
      - run: python scripts/sync_evaluator.py offline-evaluation/test_memory.json
      - run: ruff check src tests
      - run: pytest -m 'not integration' -q
  andes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore pip download and wheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip311-andes-v1-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip311-andes-v1-
      - run: pip install -e '.[dev,engineering]'
      - run: pytest -m integration -q
  windows-scientific:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -e '.[dev,engineering,mcp]'
      - run: python scripts/sync_benchmark.py benchmark-assets
      - run: python scripts/sync_evaluator.py offline-evaluation/test_memory.json
      - run: python -m pytest -m 'not integration' -q
      - run: python -m pytest -m integration -q
