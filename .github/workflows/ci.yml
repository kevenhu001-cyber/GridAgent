name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A superseded PR commit does not need to consume another full packaging run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore pip download and wheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip311-unit-v1-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip311-unit-v1-
      - run: pip install -e '.[dev,mcp]'
      - name: Restore pinned public benchmark assets
        uses: actions/cache@v4
        with:
          path: benchmark-assets
          key: ${{ runner.os }}-public-benchmark-v1-${{ hashFiles('src/gridagent/paper_assets.json', 'scripts/sync_benchmark.py') }}
      - run: python scripts/sync_benchmark.py benchmark-assets
      - run: python scripts/sync_evaluator.py offline-evaluation/test_memory.json
      - run: ruff check src tests
      - run: pytest -m 'not integration' -q --timeout=300
  andes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore pip download and wheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip311-andes-v1-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip311-andes-v1-
      - run: pip install -e '.[dev,engineering]'
      - run: pytest -m integration -q --timeout=900
  windows-scientific:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -e '.[dev,engineering,mcp]'
      - run: python scripts/sync_benchmark.py benchmark-assets
      - run: python scripts/sync_evaluator.py offline-evaluation/test_memory.json
      # Verbose output identifies the exact test that fails or stalls when the
      # Windows runner is far slower than Linux; -q hides that information.
      # Per-test timeouts turn an indefinite transport deadlock into a named
      # failure instead of consuming the full job timeout.
      - run: python -m pytest -m 'not integration' -v --durations=30 --timeout=300 --timeout-method=thread
      - run: python -m pytest -m integration -v --durations=15 --timeout=900 --timeout-method=thread

  uv-managed-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned uv
        run: python -m pip install uv==0.13.9
      - name: Provision Astral standalone Python and development environment
        run: |
          uv python install 3.11
          uv venv --managed-python --python 3.11 .venv
          uv pip install --python .venv/Scripts/python.exe -e ".[dev,core]"
      - name: Test plugin transaction and scientific library imports
        run: |
          .venv/Scripts/python.exe -m pytest tests/test_plugins.py -q
          .venv/Scripts/python.exe -c "import andes, pandapower, scipy; print('scientific imports OK')"
      - name: Exercise actual uv-backed plugin installation
        shell: pwsh
        run: |
          $env:GRIDAGENT_UV = (Get-Command uv).Source
          $env:GRIDAGENT_PLUGIN_ROOT = Join-Path $env:RUNNER_TEMP "gridagent-uv-plugins"
          .venv/Scripts/python.exe -c "from gridagent import plugins; print(plugins.install('rainflow')); assert plugins.installed_target('rainflow'); print(plugins.uninstall('rainflow'))"
