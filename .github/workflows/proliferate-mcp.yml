name: Proliferate integration protocol
on:
  push:
    branches: [migration/proliferate]
    paths:
      - 'src/gridagent/**'
      - 'tests/test_mcp_server.py'
      - 'pyproject.toml'
      - '.github/workflows/proliferate-mcp.yml'
  pull_request:
    paths:
      - 'src/gridagent/mcp_server.py'
      - 'tests/test_mcp_server.py'
      - 'pyproject.toml'
      - '.github/workflows/proliferate-mcp.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m pytest -q tests/test_mcp_server.py
