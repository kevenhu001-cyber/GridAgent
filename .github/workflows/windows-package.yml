name: Windows installer preview

on:
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - '.github/workflows/release.yml'
      - 'scripts/package-windows-preview.ps1'
      - 'scripts/stage-windows-runtime.ps1'
      - 'scripts/qualify-staged-runtime.py'
      - 'pyproject.toml'
      - 'src/gridagent/kernel_batch.py'
      - 'src/gridagent/scientific_notebook.py'
      - 'vendor/proliferate/apps/desktop/src-tauri/src/gridagent_runtime.rs'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_PROLIFERATE_TELEMETRY_DISABLED: '1'
      VITE_PROLIFERATE_DISABLE_CLOUD_COMPUTE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Validate version and package Windows preview
        shell: pwsh
        run: ./scripts/package-windows-preview.ps1
      - name: Upload MSI, NSIS and checksums
        uses: actions/upload-artifact@v4
        with:
          name: gridagent-windows-x64-preview
          path: dist/windows-preview/*
          if-no-files-found: error
          retention-days: 14
