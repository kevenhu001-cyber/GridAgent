name: Embedded Pi runtime
on:
  pull_request:
    paths:
      - 'integration/pi-runtime/**'
      - 'vendor/proliferate/anyharness/sdk/src/**'
      - 'vendor/proliferate/apps/packages/product-client/src/lib/access/pi/**'
      - 'vendor/proliferate/apps/packages/product-client/src/host/desktop-bridge.ts'
      - 'vendor/proliferate/apps/desktop/src-tauri/src/pi_bridge.rs'
      - 'vendor/proliferate/apps/desktop/src/lib/access/scientific/**'
      - '.github/workflows/pi-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'integration/pi-runtime/**'
      - 'vendor/proliferate/anyharness/sdk/src/**'
      - 'vendor/proliferate/apps/packages/product-client/src/lib/access/pi/**'
      - 'vendor/proliferate/apps/packages/product-client/src/host/desktop-bridge.ts'
      - 'vendor/proliferate/apps/desktop/src-tauri/src/pi_bridge.rs'
      - 'vendor/proliferate/apps/desktop/src/lib/access/scientific/**'
      - '.github/workflows/pi-runtime.yml'
permissions:
  contents: read
jobs:
  pi-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integration/pi-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Compile retained AnyHarness SDK contracts and reducer
        run: npm exec --yes --package=typescript@5.7.3 -- tsc -p ../../vendor/proliferate/anyharness/sdk/tsconfig.json
      - name: Verify Pi events using original transcript reducer
        run: node --test product-reducer.integration.mjs
