name: Embedded Pi runtime
on:
  pull_request:
    paths:
      - 'integration/pi-runtime/**'
      - '.github/workflows/pi-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'integration/pi-runtime/**'
      - '.github/workflows/pi-runtime.yml'
permissions:
  contents: read
jobs:
  pi-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integration/pi-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
